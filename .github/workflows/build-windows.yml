name: Build Windows executables

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "dist/**"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build application
        run: python -m PyInstaller --clean --noconfirm WorkLog.spec

      - name: Build installer
        run: python -m PyInstaller --clean --noconfirm WorkLogSetup.spec

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: WorkLog-Windows
          path: |
            dist/WorkLog.exe
            dist/WorkLogSetup.exe
          if-no-files-found: error

      - name: Commit executables to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/WorkLog.exe dist/WorkLogSetup.exe
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build Windows executables"
          git push
